map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name localhost;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name localhost;

  error_page 497 =301 https://$host$request_uri;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change every build, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    # Never cache index.html — the browser must always see the latest bundle hash.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Proxy WebSocket
  location /ws {
    # Preserve the full request URI when proxying and force HTTP/1.1 for upgrades
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

  # Ensure nginx performs the upgrade/tunnelling instead of just forwarding headers
  proxy_set_header Upgrade $http_upgrade;
  # use map'd value to signal Upgrade when appropriate
  proxy_set_header Connection $connection_upgrade;

    # Forward Sec-WebSocket-Protocol so backend middleware can read subprotocols (e.g. token)
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket long-lived connection settings
    proxy_read_timeout 86400;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
